<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazclone | Product Details</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    
    <div class="bg-gradient-glow"></div>

    <!-- Floating Glass Navbar -->
    <div class="navbar-wrapper container">
        <header class="navbar glass">
            <div class="nav-brand">
                <i class="ph-fill ph-shopping-bag" style="font-size: 1.5rem; color: var(--brand-secondary)"></i>
                <a href="index.html">amaz<span class="gradient-text">clone</span></a>
            </div>
            
            <div class="nav-search">
                <i class="ph ph-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="Search products, brands, or categories...">
            </div>
            
            <div class="nav-tools">
                <div class="nav-tool" id="theme-toggle" title="Toggle Theme">
                    <i class="ph ph-moon" id="theme-icon" style="font-size: 1.2rem;"></i>
                </div>
                <a href="#" class="nav-tool" id="nav-wishlist-btn"><i class="ph ph-heart" style="font-size: 1.2rem;"></i> Wishlist</a>
                <a href="#" class="btn btn-primary" id="nav-cart-btn"><i class="ph ph-shopping-cart"></i> Cart</a>
            </div>
        </header>
        
        <!-- Category Scroller -->
        <nav class="category-nav fade-in" id="category-nav-container">
            <div class="skeleton" style="width: 80px; height: 20px;"></div>
            <div class="skeleton" style="width: 100px; height: 20px;"></div>
            <div class="skeleton" style="width: 120px; height: 20px;"></div>
        </nav>
    </div>

    <main class="container product-page-container" id="main-content">
        <!-- Breadcrumb -->
        <nav class="breadcrumb" id="product-breadcrumb">
            <div class="skeleton" style="width: 250px; height: 16px;"></div>
        </nav>

        <div class="product-layout fade-up">
            <!-- Left: Gallery -->
            <div class="product-gallery" id="product-gallery">
                <div class="skeleton" style="width: 100%; height: 400px; border-radius: var(--radius-lg);"></div>
            </div>

            <!-- Center: Info -->
            <div class="product-info" id="product-info">
                <div class="skeleton" style="width: 60%; height: 24px; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="width: 100%; height: 40px; margin-bottom: 2rem;"></div>
                <div class="skeleton" style="width: 100%; height: 150px;"></div>
            </div>

            <!-- Right: Purchase Panel -->
            <div class="purchase-panel" id="purchase-panel">
                <div class="skeleton" style="width: 100%; height: 250px; border-radius: var(--radius-lg);"></div>
            </div>
        </div>

        <!-- Product Tabs -->
        <section class="product-tabs fade-up" style="margin-top: 3rem;">
            <div class="tab-list">
                <button class="tab-btn active" data-target="tab-desc">Description</button>
                <button class="tab-btn" data-target="tab-specs">Specifications</button>
                <button class="tab-btn" data-target="tab-reviews">Reviews</button>
                <button class="tab-btn" data-target="tab-ai"><i class="ph-fill ph-sparkle"></i> AI Insights</button>
            </div>
            
            <div class="tab-content active" id="tab-desc">
                <div class="skeleton" style="width: 100%; height: 100px;"></div>
            </div>
            <div class="tab-content" id="tab-specs">
                <div class="skeleton" style="width: 100%; height: 100px;"></div>
            </div>
            <div class="tab-content" id="tab-reviews">
                <div class="skeleton" style="width: 100%; height: 100px;"></div>
            </div>
            <div class="tab-content" id="tab-ai">
                <div class="skeleton" style="width: 100%; height: 100px;"></div>
            </div>
        </section>

        <!-- AI Recommendations -->
        <section class="recommendations-section fade-up" style="margin-top: 4rem;">
            <h2 class="section-title"><i class="ph-fill ph-sparkle gradient-text"></i> AI Picks For You</h2>
            <p class="section-subtitle">Recommended because they are highly similar to this item.</p>
            <div class="horizontal-slider" id="ai-recommendations-slider">
                <!-- Skeletons -->
                <div class="skeleton" style="min-width: 280px; height: 350px; border-radius: var(--radius-md);"></div>
                <div class="skeleton" style="min-width: 280px; height: 350px; border-radius: var(--radius-md);"></div>
                <div class="skeleton" style="min-width: 280px; height: 350px; border-radius: var(--radius-md);"></div>
                <div class="skeleton" style="min-width: 280px; height: 350px; border-radius: var(--radius-md);"></div>
            </div>
        </section>

        <!-- Customers Also Viewed -->
        <section class="recommendations-section fade-up" style="margin-top: 4rem; margin-bottom: 4rem;">
            <h2 class="section-title">Customers Also Viewed</h2>
            <div class="horizontal-slider" id="also-viewed-slider">
                <div class="skeleton" style="min-width: 280px; height: 350px; border-radius: var(--radius-md);"></div>
                <div class="skeleton" style="min-width: 280px; height: 350px; border-radius: var(--radius-md);"></div>
                <div class="skeleton" style="min-width: 280px; height: 350px; border-radius: var(--radius-md);"></div>
                <div class="skeleton" style="min-width: 280px; height: 350px; border-radius: var(--radius-md);"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <div>
                <strong style="font-family: var(--font-display); font-size: 1.2rem;">amaz<span class="gradient-text">clone</span></strong>
                <p style="margin-top: 0.5rem;">The next-generation recommendation engine.</p>
            </div>
            <div>
                <p>&copy; 2026 Amazclone Platform.</p>
                <p>Powered by FastAPI & Advanced Machine Learning.</p>
            </div>
        </div>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/product.js"></script>
</body>
</html>
